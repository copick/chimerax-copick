[build-system]
requires = ["setuptools>=45"]

[project]
name = "ChimeraX-copick"
dynamic = ["version", "classifiers", "requires-python"]
dependencies = [
    "ChimeraX-Core>=1.7",
    "ChimeraX-ArtiaX>=0.7.0",
    "ChimeraX-OME-Zarr>=0.5.4",
    "pydantic",
    "hatchling",
    "aiohttp>=3.13.0",
    "s3fs>=2024.3.1",
    "copick[all]>=1.28.0",
    "copick-shared-ui>=0.8.0",
]
authors = [
  {name = "Utz H. Ermel", email = "utz@ermel.me"},
]
description = "ChimeraX extension for collaborative annotation of cryo-electron tomograms."
readme = "README.md"
license = {file = "LICENSE"}
keywords = ["cryoet", "cryo-et", "tomography", "annotation", "segmentation", "collaborative", "copick"]

[tool.setuptools.dynamic]
version = {attr = "chimerax.copick.__version__"}

[project.urls]
Repository = "https://github.com/copick/chimerax-copick.git"
Issues = "https://github.com/copick/chimerax-copick/issues"

[project.optional-dependencies]
dev = [
    "black",
    "ipython",
    "pre-commit",
    "pytest",
    "ruff",
]

[chimerax]
categories = ["Volume Data", "General"]
package = "chimerax.copick"
min-session-version="1"
max-session-version="1"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
]

[chimerax.tool."Copick"]
tool_name = "Copick"
category = ["Volume Data", "General"]
synopsis = "Collaborative annotation of cryo-electron tomograms."

[chimerax.tool."Copick Annotate"]
tool_name = "Copick Annotate"
category = ["Volume Data", "General"]
synopsis = "Trace filaments, edit and browse instances of a copick run."

[chimerax.command."copick annotate"]
category = "General"
synopsis = "Show or hide the Copick Annotate window."

[chimerax.command."copick start"]
category = "General"
synopsis = "Start a copick session or load a new config file."

[chimerax.command."copick new"]
category = "General"
synopsis = "Create a copick config file and load the session."

[chimerax.command."copick open run"]
category = "General"
synopsis = "Open a run's tomogram in the copick session."

[chimerax.command."copick show tomogram"]
category = "General"
synopsis = "Show a tomogram of the active run (tomo type, 'next' or 'back'), loading it if needed."

[chimerax.command."copick close tomogram"]
category = "General"
synopsis = "Unload a loaded tomogram (default: the shown one), or all others."

[chimerax.command."copick list tomograms"]
category = "General"
synopsis = "List the loaded tomograms of the active run."

[chimerax.command."copick open picks"]
category = "General"
synopsis = "Show picks in the active run matching a copick URI."

[chimerax.command."copick open mesh"]
category = "General"
synopsis = "Show meshes in the active run matching a copick URI."

[chimerax.command."copick open segmentation"]
category = "General"
synopsis = "Show segmentations in the active run matching a copick URI."

[chimerax.command."copick show picks"]
category = "General"
synopsis = "Show picks in the active run matching a copick URI."

[chimerax.command."copick show mesh"]
category = "General"
synopsis = "Show meshes in the active run matching a copick URI."

[chimerax.command."copick show segmentation"]
category = "General"
synopsis = "Show segmentations in the active run matching a copick URI."

[chimerax.command."copick hide picks"]
category = "General"
synopsis = "Hide picks in the active run matching a copick URI."

[chimerax.command."copick hide mesh"]
category = "General"
synopsis = "Hide meshes in the active run matching a copick URI."

[chimerax.command."copick hide segmentation"]
category = "General"
synopsis = "Hide segmentations in the active run matching a copick URI."

[chimerax.command."copick new picks"]
category = "General"
synopsis = "Create a new (empty) set of picks in the active run."

[chimerax.command."copick reload"]
category = "General"
synopsis = "Reload the current copick session from its config file."

[chimerax.command."copick view"]
category = "General"
synopsis = "Switch the viewport between 3D canvas, gallery and details views."

[chimerax.command."copick dock"]
category = "General"
synopsis = "Dock a tool window to an edge, float it, or tab it with another tool."

[chimerax.command."copick spotlight"]
category = "General"
synopsis = "Show a spherical spotlight of tomogram data around the active particle."

[chimerax.command."copick open filaments"]
category = "General"
synopsis = "Show filament sets in the active run matching a copick URI."

[chimerax.command."copick show filaments"]
category = "General"
synopsis = "Show filament sets in the active run matching a copick URI."

[chimerax.command."copick hide filaments"]
category = "General"
synopsis = "Hide filament sets in the active run matching a copick URI."

[chimerax.command."copick new filaments"]
category = "General"
synopsis = "Start tracing a new set of filaments in the active run."

[chimerax.command."copick filament"]
category = "General"
synopsis = "Filament tracing actions on the active filament set."

[chimerax.command."copick filament trace"]
category = "General"
synopsis = "Switch the filament trace mouse mode on or off."

[chimerax.command."copick filament join"]
category = "General"
synopsis = "Join filaments end to end (default: those selected in the Annotate window)."

[chimerax.command."copick filament cut"]
category = "General"
synopsis = "Cut mode on or off, or cut a filament in two at a point."

[chimerax.command."copick filament save"]
category = "General"
synopsis = "Save the active filament set, optionally with sampled picks."

[chimerax.command."copick new segmentation"]
category = "General"
synopsis = "Start a new instance segmentation in the active run."

[chimerax.command."copick instance"]
category = "General"
synopsis = "Instance editing and browsing actions."

[chimerax.command."copick instance edit"]
category = "General"
synopsis = "Edit an instance segmentation of the active run."

[chimerax.command."copick instance brush"]
category = "General"
synopsis = "Set the instance paint brush radius."

[chimerax.command."copick instance save"]
category = "General"
synopsis = "Save the edited instance segmentation."

[chimerax.command."copick colorpicks"]
category = "General"
synopsis = "Colour particle lists by instance ID or by object."

[chimerax.command."copick save"]
category = "General"
synopsis = "Save all edited picks, filaments and instance segmentations."

[chimerax.package-data]
"src/icons/" = ["*.png"]
"src/fonts/" = ["*.ttf", "*.txt"]
"src/docs/user/" = ["*.html", "*.png"]
"src/docs/user/general/" = ["*.html"]
"src/docs/user/tools/" = ["*.html"]
"src/docs/user/commands/" = ["*.html"]

